services:
  agent-service:
    build:
      context: ./backend/agent-service
    container_name: electra-agent
    restart: unless-stopped
    ports:
      - "4001:3000"
    env_file:
      - ./backend/agent-service/.env

  app-service:
    build:
      context: ./backend/app-service
    container_name: electra-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/app-service/.env

  frontend:
    build:
      context: ./frontend
    container_name: electra-frontend
    restart: unless-stopped
    ports:
      - "4002:80"